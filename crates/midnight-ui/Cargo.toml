[package]
name = "midnight-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
midnight-core.workspace = true
midnight-ui-bindings = { path = "../midnight-ui-bindings" }
slint = { workspace = true, features = ["unstable-winit-030"] }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
unicode-segmentation = "=1.13.3"
serde_json = "1.0"
# Exact pinned internal event observation for embedded tooltip host coordinates.
i-slint-core = { version = "=1.18.1", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(target_os = "linux")'.dependencies]
x11-dl = "=2.21.0"
