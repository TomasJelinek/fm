[package]
name = "midnight-viewer-engine"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Opening phase timestamps (`src/open_trace.rs`) in optimized builds, for the
# `open_latency` probe only. Debug builds always contain them; the application
# builds without this feature.
open-trace = []

[dependencies]
midnight-media-host = { path = "../midnight-media-host" }
midnight-media-output = { path = "../midnight-media-output" }
midnight-core.workspace = true
# Installs the HTML viewer's AppArmor profile when the user asks (Linux only; nothing elsewhere).
midnight-elevation = { path = "../midnight-elevation" }
midnight-office-preview = { path = "../midnight-office-preview" }
midnight-native-filesystem-host = { path = "../midnight-native-filesystem-host" }
midnight-web-viewer-host = { path = "../midnight-web-viewer-host" }
midnight-plugin-host = { path = "../midnight-plugin-host" }
midnight-image-viewer-host = { path = "../midnight-image-viewer-host" }
midnight-viewer-render = { path = "../midnight-viewer-render" }
midnight-work-budget = { path = "../midnight-work-budget", features = ["resident-workers"] }
tokio.workspace = true
unicode-segmentation = "=1.13.3"
unicase = "=2.10.0"

[dev-dependencies]
tempfile.workspace = true
