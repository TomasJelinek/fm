[package]
name = "midnight-platform-common"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
# All tests/*.rs files are modules of one binary; see tests/integration.rs.
autotests = false

[dependencies]
midnight-core.workspace = true
midnight-work-budget = { path = "../midnight-work-budget" }
icu_casemap = "=2.4.0"
icu_locale_core = "=2.4.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "=0.10.9"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
regex = "=1.13.1"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.6", features = ["fs"] }

[dev-dependencies]
tempfile.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
