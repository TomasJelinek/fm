[package]
name = "midnight-platform-linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
midnight-core.workspace = true
midnight-platform-common.workspace = true
libc = "0.2"
fontdb = { version = "=0.24.0", default-features = false, features = ["std", "fs"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
rustix = { version = "1.1.6", features = ["fs", "process"] }
chrono = { version = "=0.4.45", default-features = false, features = ["clock"] }
notify = { version = "=8.2.1", default-features = false }
arboard = { version = "=3.7.0", default-features = false, features = ["wayland-data-control"] }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile.workspace = true
