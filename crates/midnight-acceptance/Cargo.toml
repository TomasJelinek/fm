[package]
name = "midnight-acceptance"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
# The opt-in end-to-end acceptance suite (docs/developer/acceptance.md). Nothing here
# runs in `cargo test --workspace`, CI or `./build.sh --validate`: the only test target
# requires the `acceptance` feature, which no other package enables, and every
# dependency is optional behind it, so a normal workspace build compiles an empty
# library and leaves every other package's features unchanged.
autotests = false
autobenches = false
autoexamples = false

[lib]
test = false
doctest = false

[features]
acceptance = [
    "dep:midnight-core",
    "dep:midnight-engine",
    "dep:midnight-platform",
    "dep:midnight-ui",
    # The panels' acceptance-only native input seam (wheel notches, focus, system settings).
    "midnight-ui/acceptance-seams",
    "dep:slint",
    "dep:i-slint-core",
    "dep:tokio",
    "dep:midnight-compare-engine",
    "dep:midnight-compare-ui",
    # The comparator's acceptance-only native input seam (wheel notches).
    "midnight-compare-ui/acceptance-seams",
    "dep:midnight-native-filesystem-host",
    "dep:midnight-thumbnail-host",
    "dep:midnight-viewer-engine",
    "dep:midnight-viewer-ui",
    # The acceptance-only native input seam (wheel notches, focus, system settings).
    "midnight-viewer-ui/acceptance-seams",
    "dep:midnight-work-budget",
    "dep:windows",
]

[dependencies]
midnight-core = { workspace = true, optional = true }
midnight-engine = { workspace = true, optional = true }
midnight-platform = { workspace = true, optional = true }
midnight-ui = { workspace = true, optional = true }
slint = { workspace = true, optional = true }
# Viewers, comparators, thumbnails and archive browsing through the installed plugin
# packages (tests/acceptance/viewers_support.rs), with the features midnight-explorer
# already uses, so the shared crates' feature sets do not change.
midnight-compare-engine = { path = "../midnight-compare-engine", optional = true }
midnight-compare-ui = { path = "../midnight-compare-ui", optional = true }
midnight-native-filesystem-host = { path = "../midnight-native-filesystem-host", optional = true }
midnight-thumbnail-host = { path = "../midnight-thumbnail-host", optional = true }
midnight-viewer-engine = { path = "../midnight-viewer-engine", optional = true }
midnight-viewer-ui = { path = "../midnight-viewer-ui", optional = true }
midnight-work-budget = { path = "../midnight-work-budget", features = ["resident-workers"], optional = true }
# The exact version and features midnight-ui already uses, for item-tree inspection.
i-slint-core = { version = "=1.18.1", default-features = false, features = ["std"], optional = true }
tokio = { workspace = true, optional = true }

# The video scenario's H.264 + AAC movie, written by Windows' own encoders (Media
# Foundation's Sink Writer) at test time, the file identities the transfer scenarios
# read (`GetFileInformationByHandle`, `Win32_Storage_FileSystem`), and the native
# property sheet the Properties scenario finds, reads and pictures
# (`Win32_UI_WindowsAndMessaging`, `Win32_Graphics_Gdi`; midnight-platform-windows
# already enables both, so the resolved feature set does not change).
[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", optional = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Media_MediaFoundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_UI_WindowsAndMessaging",
] }

# `harness = false`: tests/acceptance.rs has its own main that runs the scenarios
# with bounded workers and prints the summary (see docs/developer/acceptance.md).
[[test]]
name = "acceptance"
path = "tests/acceptance.rs"
harness = false
required-features = ["acceptance"]
