[package]
name = "midnight-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
# All tests/*.rs files are modules of one binary; see tests/integration.rs.
autotests = false

[dependencies]
midnight-web-viewer-api = { path = "../../web-viewer-api/midnight-web-viewer-api" }
unicase = "=2.10.0"
# Archive passwords are zeroized when dropped (`ArchivePassword`).
zeroize = { version = "=1.9.1", default-features = false, features = ["alloc"] }

[[test]]
name = "integration"
path = "tests/integration.rs"
