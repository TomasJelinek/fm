[package]
name = "midnight-worker-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Opt-in backend timing only; production startup behavior is unchanged.
startup-diagnostics = []

[dependencies]
midnight-worker-sdk = { path = "../../worker-api/midnight-worker-sdk" }
# Spool reads verify each appended chunk instead of synchronously flushing it.
crc32fast = { version = "=1.5.4", default-features = false, features = ["std"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Wdk_Storage_FileSystem", "Wdk_Foundation", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Isolation", "Win32_System_Threading", "Win32_System_Diagnostics_Debug", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_SystemServices", "Win32_System_SystemInformation"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.6", features = ["fs", "process"] }

[dev-dependencies]
tempfile.workspace = true

# The containment probe that the integration tests start has no unit tests, so
# `cargo test` neither builds nor starts an empty test harness for it. The tests still
# receive the built probe as CARGO_BIN_EXE_midnight-worker-probe.
# `probe_binary_has_no_unit_tests` in src/lib.rs fails if one is added while this is set.
[[bin]]
name = "midnight-worker-probe"
path = "src/bin/midnight-worker-probe.rs"
test = false
