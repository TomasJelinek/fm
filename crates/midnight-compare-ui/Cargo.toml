[package]
name = "midnight-compare-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# All tests/*.rs files are modules of one binary; see tests/integration.rs.
autotests = false

[dependencies]
midnight-core.workspace = true
midnight-compare-engine = { path = "../midnight-compare-engine" }
midnight-ui-input = { path = "../midnight-ui-input" }
slint = { workspace = true, features = ["unstable-winit-030"] }

[build-dependencies]
# Keep the normal Slint compiler feature unification while reusing the host adapter.
slint-build.workspace = true
i-slint-compiler = { version = "=1.18.1", default-features = false, features = ["rust"] }
spin_on = "=0.1.1"
proc-macro2 = "=1.0.107"

[dev-dependencies]
i-slint-core = { version = "=1.18.1", default-features = false, features = ["std"] }
tokio.workspace = true
midnight-work-budget = { path = "../midnight-work-budget", features = ["resident-workers"] }

[[test]]
name = "integration"
path = "tests/integration.rs"
