[package]
name = "midnight-viewer-render"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# All tests/*.rs files are modules of one binary; see tests/integration.rs.
autotests = false

[dependencies]
parley = { version = "=0.11.1", features = ["complex-scripts"] }
swash = "=0.2.10"
unicode-segmentation = "=1.13.3"
unicode-width = "=0.2.3"

[lints.rust]
unsafe_code = "forbid"

[[test]]
name = "integration"
path = "tests/integration.rs"
