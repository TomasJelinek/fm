[package]
name = "midnight-viewer-ui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# All tests/*.rs files are modules of one binary; see tests/integration.rs.
autotests = false

[features]
# Native wheel and focus events and system-setting overrides for the acceptance suite
# (`src/acceptance_seams.rs`). Only crates/midnight-acceptance enables it: the
# application and every other package build without it.
acceptance-seams = []

[dependencies]
midnight-core.workspace = true
midnight-viewer-engine = { path = "../midnight-viewer-engine" }
midnight-ui-input = { path = "../midnight-ui-input" }
slint = { workspace = true, features = ["unstable-winit-030"] }
i-slint-core = { version = "=1.18.1", default-features = false, features = ["std"] }

# Reads the system's wheel setting (`wheel_setting_windows.rs`). midnight-platform-windows
# and midnight-elevation already enable this feature.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build.workspace = true

[dev-dependencies]
midnight-work-budget = { path = "../midnight-work-budget", features = ["resident-workers"] }
slint = { workspace = true, features = ["unstable-wgpu-30"] }
midnight-plugin-host = { path = "../midnight-plugin-host" }
# tests/selection_contrast.rs paints selected source text exactly as the backend does.
midnight-viewer-render = { path = "../midnight-viewer-render" }
tokio.workspace = true
png = "0.18"

[target.'cfg(target_os = "linux")'.dev-dependencies]
midnight-native-filesystem-host = { path = "../midnight-native-filesystem-host" }
midnight-platform-linux.workspace = true

[[test]]
name = "integration"
path = "tests/integration.rs"
