[package]
name = "midnight-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
# All tests/*.rs files are modules of one binary; see tests/integration.rs.
autotests = false

[dependencies]
midnight-core.workspace = true

[target.'cfg(windows)'.dependencies]
midnight-platform-windows.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
midnight-platform-linux.workspace = true

[dev-dependencies]
tempfile.workspace = true

# The facade has no unit tests, so `cargo test` neither builds nor starts an empty
# test harness for it; `library_has_no_unit_tests` in tests/integration.rs fails if
# one is added while this is set.
[lib]
test = false

[[test]]
name = "integration"
path = "tests/integration.rs"
