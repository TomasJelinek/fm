[package]
name = "midnight-ui-bindings"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Generated bindings have no unit tests. Keep presenter tests in midnight-ui so
# the large generated module is not compiled again as part of its test harness.
[lib]
test = false
doctest = false

[dependencies]
slint.workspace = true

[build-dependencies]
# Not called: build.rs compiles once through i-slint-compiler. Keeping slint-build keeps
# the unified i-slint-compiler features identical to a normal slint_build compile.
slint-build.workspace = true
i-slint-compiler = { version = "=1.18.1", default-features = false, features = ["rust"] }
spin_on = "=0.1.1"
proc-macro2 = "=1.0.107"
