[package]
name = "midnight-platform-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# `new_junction` (src/test_fixtures.rs) for other packages' Windows tests: a directory
# junction set with FSCTL_SET_REPARSE_POINT, so no shell or command line sees a fixture
# path (SECURITY.md), and `deny_read_data`/`restore_dacl`, which deny Everyone listing on
# such a junction below `_build` as Windows' compatibility junctions do. Only
# dev-dependencies enable it; the application builds without it.
test-fixtures = []

[target.'cfg(windows)'.dependencies]
midnight-core.workspace = true
midnight-platform-common.workspace = true
midnight-worker-platform = { path = "../midnight-worker-platform" }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_WindowsProgramming", "Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_JobObjects", "Win32_System_Pipes", "Win32_System_Ioctl", "Win32_System_Console", "Win32_System_Registry", "Win32_System_Diagnostics_Debug", "Win32_Security", "Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_System_IO", "Win32_NetworkManagement_WNet", "Win32_Globalization", "Win32_System_Time", "Win32_System_LibraryLoader", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole"] }
windows = { version = "0.62.2", features = ["Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_UI_Controls", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Ole", "Win32_System_SystemServices", "Win32_Graphics_Gdi"] }
windows-core = "=0.62.2"
base64 = "0.23.1"
arboard = { version = "=3.7.0", default-features = false }
getrandom = "=0.3.4"

[target.'cfg(windows)'.dev-dependencies]
tempfile.workspace = true
