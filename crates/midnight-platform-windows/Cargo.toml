[package]
name = "midnight-platform-windows"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[target.'cfg(windows)'.dependencies]
midnight-core.workspace = true
midnight-platform-common.workspace = true
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Ioctl", "Win32_System_Console", "Win32_System_Registry", "Win32_System_Diagnostics_Debug", "Win32_Security", "Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_System_IO", "Win32_NetworkManagement_WNet", "Win32_Globalization", "Win32_System_Time"] }
windows = { version = "0.62.2", features = ["Win32_UI_Shell", "Win32_System_Com"] }
base64 = "0.23.1"
notify = { version = "=8.2.1", default-features = false }
arboard = { version = "=3.7.0", default-features = false }

[target.'cfg(windows)'.dev-dependencies]
tempfile.workspace = true
