[package]
name = "fm-platform-linux"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
fm-core.workspace = true
fm-platform-common.workspace = true
fontdb = { version = "=0.24.0", default-features = false, features = ["std", "fs"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
rustix = { version = "1.1.6", features = ["fs"] }
notify = { version = "=8.2.1", default-features = false }

[target.'cfg(target_os = "linux")'.dev-dependencies]
tempfile.workspace = true
