[workspace]
resolver = "2"

[package]
name = "midnight-viewer-tiny-example"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
midnight-plugin-sdk = { version = "=0.1.0", registry = "midnight" }

[profile.release]
overflow-checks = true
panic = "unwind"
