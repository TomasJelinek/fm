[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
fm-core = { path = "crates/fm-core" }
fm-platform = { path = "crates/fm-platform" }
fm-platform-common = { path = "crates/fm-platform-common" }
fm-platform-windows = { path = "crates/fm-platform-windows" }
fm-platform-linux = { path = "crates/fm-platform-linux" }
fm-engine = { path = "crates/fm-engine" }
fm-ui = { path = "crates/fm-ui" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "sync", "time", "macros"] }
slint = { version = "=1.18.1", default-features = false, features = ["std", "backend-winit", "renderer-femtovg-wgpu", "renderer-software", "compat-1-2"] }
slint-build = "=1.18.1"
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Keep backend debugging intact while avoiding unoptimized per-frame UI/renderer
# work. Native resize measurements are documented in docs/verification.
[profile.dev.package.i-slint-core]
opt-level = 2

[profile.dev.package.i-slint-renderer-femtovg]
opt-level = 2

[profile.dev.package.femtovg]
opt-level = 2

[profile.dev.package.wgpu-core]
opt-level = 2

[profile.dev.package.wgpu-hal]
opt-level = 2

[profile.dev.package.fm-ui]
opt-level = 1

# Text shaping and font lookup are part of every resized text layout too.
[profile.dev.package.parley]
opt-level = 2

[profile.dev.package.fontique]
opt-level = 2

[profile.dev.package.harfrust]
opt-level = 2

[profile.dev.package.skrifa]
opt-level = 2

[profile.dev.package.swash]
opt-level = 2
