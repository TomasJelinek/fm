[package]
name = "midnight-worker-sdk"
description = "Public restricted-worker startup contract for Midnight Explorer executable plugins"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
publish = false

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Threading", "Win32_System_JobObjects"] }

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
