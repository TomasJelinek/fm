[package]
name = "midnight-filesystem-api"
version = "0.5.0"
edition = "2024"
rust-version = "1.99"
description = "Versioned bounded protocol for read-only Midnight filesystem workers"
readme = "../PROTOCOL.md"

[dependencies]
# Protocol 4 passwords are zeroized when dropped, together with the frames that carry them.
zeroize = { version = "1.8", default-features = false, features = ["alloc"] }

[lints.rust]
unsafe_code = "forbid"
