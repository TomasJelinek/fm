[package]
name = "midnight-filesystem-network"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]

[dependencies]
midnight-filesystem-plugin-api = { version = "=0.2.0", path = "../../filesystem-api/midnight-filesystem-plugin-api" }
midnight-filesystem-plugin-sdk = { version = "=0.2.0", path = "../../filesystem-api/midnight-filesystem-plugin-sdk" }

[profile.release]
overflow-checks = true
panic = "unwind"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_NetworkManagement_WNet"] }

[target.'cfg(target_os = "linux")'.dependencies]
libloading = "=0.8.9"
