[workspace]
resolver = "2"

[package]
name = "midnight-viewer-source"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "GPL-3.0-or-later"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
midnight-plugin-sdk = { version = "=0.2.1", registry = "midnight" }
regex = { version = "=1.13.1", default-features = false, features = ["std", "perf"] }

# The development application loads development plugin builds. Unoptimized decoders,
# text and pixel loops made debug viewers several times slower than shipped ones
# (a 3840x2160 JPEG took 8.5 s instead of 0.8 s), which hid real costs and invented
# others. Optimize all dependencies and keep this crate debuggable and checked.
# Measurements: docs/verification/2026-11-20-viewer-speed.md.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = false
strip = "symbols"
opt-level = 3
lto = "fat"
codegen-units = 1
overflow-checks = true
panic = "unwind"

[lints.rust]
unsafe_code = "deny"
