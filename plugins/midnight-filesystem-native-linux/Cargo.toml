[package]
name = "midnight-filesystem-native-linux"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[workspace]

[dependencies]
midnight-filesystem-plugin-api = { version = "=0.2.0", path = "../../filesystem-api/midnight-filesystem-plugin-api" }
midnight-filesystem-plugin-sdk = { version = "=0.2.0", path = "../../filesystem-api/midnight-filesystem-plugin-sdk" }

[target.'cfg(target_os = "linux")'.dependencies]
libc = { version = "=0.2.191", default-features = false, features = ["std"] }

[profile.release]
overflow-checks = true
panic = "unwind"
