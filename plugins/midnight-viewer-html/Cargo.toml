[package]
name = "midnight-viewer-html"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[lib]
name = "midnight_viewer_html"
crate-type = ["cdylib", "rlib"]

[features]
default = ["native-cef"]
native-cef = ["dep:cef"]
# Metadata-only profiling; never enabled in the shipped provider.
diagnostic-timing = []
# Fixed compositor-path experiment; never enabled in the shipped provider.
diagnostic-software-compositing = ["diagnostic-timing"]

[dependencies]
cef = { version = "=156.4.0", default-features = false, features = ["sandbox"], optional = true }
midnight-web-viewer-api = { version = "=0.4.0", registry = "midnight" }

[[bin]]
name = "midnight-html-linux-launcher"
path = "src/main.rs"
required-features = ["native-cef"]

# Keep Chromium's CPU pixel conversion/composition responsive in development.
[profile.dev.package.midnight-viewer-html]
opt-level = 2

# The development application loads development plugin builds; optimize the CEF
# bindings and the SDK like every other viewer plugin's dependencies.
# Measurements: docs/verification/2026-11-20-viewer-speed.md.
[profile.dev.package."*"]
opt-level = 3
