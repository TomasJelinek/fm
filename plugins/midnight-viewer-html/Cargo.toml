[package]
name = "midnight-viewer-html"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[workspace]

[lib]
name = "midnight_viewer_html"
crate-type = ["cdylib", "rlib"]

[features]
default = ["native-cef"]
native-cef = ["dep:cef"]

[dependencies]
cef = { version = "=156.4.0+156.0.26", default-features = false, features = ["sandbox"], optional = true }
midnight-web-viewer-api = { version = "=0.1.0", registry = "midnight" }

[[bin]]
name = "midnight-html-linux-launcher"
path = "src/main.rs"
required-features = ["native-cef"]

# Keep Chromium's CPU pixel conversion/composition responsive in development
# without changing optimization or iteration settings for dependencies.
[profile.dev.package.midnight-viewer-html]
opt-level = 2
