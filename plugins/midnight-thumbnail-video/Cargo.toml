[package]
name = "midnight-thumbnail-video"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace]

[features]
playback-worker = ["dep:midnight-worker-sdk"]

[[bin]]
name = "midnight-video-playback"
path = "src/bin/midnight-video-playback.rs"
required-features = ["playback-worker"]

[dependencies]
midnight-thumbnail-sdk = { version = "=0.2.0", registry = "midnight" }
midnight-worker-sdk = { version = "=0.2.0", registry = "midnight", optional = true }
ffmpeg-next = { version = "=9.0.0", default-features = false, features = ["codec", "format", "software-scaling", "software-resampling"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
