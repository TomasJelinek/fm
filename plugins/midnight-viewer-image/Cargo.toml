[workspace]
resolver = "2"

[package]
name = "midnight-viewer-image"
version = "0.4.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "GPL-3.0-or-later"
description = "Independent restricted image viewer for Midnight Explorer"

[dependencies]
midnight-image-decoder = { path = "../image-decoder" }
midnight-image-viewer-sdk = { version = "=0.5.0", registry = "midnight" }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
[dev-dependencies]
moxcms = "=0.8.1"

# The development application loads development plugin builds. Unoptimized decoders,
# text and pixel loops made debug viewers several times slower than shipped ones
# (a 3840x2160 JPEG took 8.5 s instead of 0.8 s), which hid real costs and invented
# others. Optimize all dependencies; this crate's own pixel loops get level 2 and
# keep their debug assertions. Measurements: docs/verification/2026-11-20-viewer-speed.md.
[profile.dev]
opt-level = 2

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
incremental = false
debug = false
strip = "symbols"
debug-assertions = false
overflow-checks = true
panic = "unwind"

[lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
image = { path = "../../vendor/image" }
