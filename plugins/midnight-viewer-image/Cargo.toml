[workspace]
resolver = "2"

[package]
name = "midnight-viewer-image"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"
description = "Independent restricted image viewer for Midnight Explorer"

[dependencies]
midnight-image-decoder = { path = "../image-decoder" }
midnight-image-viewer-sdk = { version = "=0.3.0", registry = "midnight" }
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico", "tiff"] }
[dev-dependencies]
moxcms = "=0.8.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
incremental = false
debug = false
strip = "symbols"
debug-assertions = false
overflow-checks = true
panic = "unwind"

[lints.rust]
unsafe_code = "forbid"

[patch.crates-io]
image = { path = "../../vendor/image" }
