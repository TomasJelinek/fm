name: build-and-test

# Pull requests run once (not again for their push); main and manual runs too.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer push supersedes an unfinished run of the same branch or pull request;
# every main commit keeps its own complete run.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PYTHONUTF8: "1"
  # Formatting metadata needs the public registry name even before --config is
  # passed to compilation; dependency resolution uses the released local bundle.
  CARGO_REGISTRIES_MIDNIGHT_INDEX: https://midnight-explorer.invalid/api-index

jobs:
  public-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      # cargo package inspects repository ignore files through libgit2, which
      # cannot lazily fetch blobs omitted by checkout's sparse clone.
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
      - name: Prepare SDK release workspace
        run: |
          mkdir -p "$GITHUB_WORKSPACE/_build/tmp"
          echo "TMPDIR=$GITHUB_WORKSPACE/_build/tmp" >> "$GITHUB_ENV"
          echo "CARGO_TARGET_DIR=$GITHUB_WORKSPACE/_build/sdk-target" >> "$GITHUB_ENV"
      - name: Public API and SDK checks
        run: |
          cargo fetch --manifest-path api/Cargo.toml --locked
          cargo fmt --manifest-path api/Cargo.toml --all -- --check
          cargo test --manifest-path api/Cargo.toml --all-targets --locked --offline
          cargo clippy --manifest-path api/Cargo.toml --all-targets --locked --offline -- -D warnings
      - name: C and Rust ABI layout agreement
        run: bash api/scripts/check-abi.sh "$GITHUB_WORKSPACE/_build/api-abi/linux"
      - name: Build public SDK release bundle
        id: sdk
        run: |
          output=$(bash api/scripts/package.sh)
          printf '%s\n' "$output"
          bundle=$(printf '%s\n' "$output" | sed -n 's/^Public API\/SDK release bundle: //p' | tail -n 1)
          test -f "$bundle/.cargo/config.toml"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: released-plugin-sdk
          include-hidden-files: true
          if-no-files-found: error
          path: |
            ${{ steps.sdk.outputs.bundle }}/.cargo/config.toml
            ${{ steps.sdk.outputs.bundle }}/registry/
            ${{ steps.sdk.outputs.bundle }}/vendor/
            ${{ steps.sdk.outputs.bundle }}/include/
            ${{ steps.sdk.outputs.bundle }}/artifacts.json

  viewers:
    needs: public-sdk
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
        plugin: [basic, source, markdown]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      # These builds have no application or unpublished API/SDK source available.
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /plugins/midnight-viewer-${{ matrix.plugin }}/
            /rust-toolchain.toml
            /.github/actions/
      - uses: actions/download-artifact@v4
        with:
          name: released-plugin-sdk
          path: _build/released-sdk
      - uses: ./.github/actions/rust-setup
      - name: Prepare independent workspace
        shell: pwsh
        run: |
          $temporaryDirectory = Join-Path $env:GITHUB_WORKSPACE '_build/tmp'
          New-Item -ItemType Directory -Path $temporaryDirectory -Force | Out-Null
          @("TEMP=$temporaryDirectory", "TMP=$temporaryDirectory", "TMPDIR=$temporaryDirectory") |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          if (Test-Path -LiteralPath 'crates') { throw 'Application source leaked into plugin job' }
          if (Test-Path -LiteralPath 'api') { throw 'Unreleased SDK source leaked into plugin job' }
      - name: Independent plugin tests and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $pluginRoot = 'plugins/midnight-viewer-${{ matrix.plugin }}'
          $sdk = (Resolve-Path '_build/released-sdk/.cargo/config.toml').Path
          $build = Join-Path $env:GITHUB_WORKSPACE '_build/viewer-ci'
          $config = $sdk
          if (Test-Path "$pluginRoot/scripts/prepare-sdk.ps1") {
            $config = & "$pluginRoot/scripts/prepare-sdk.ps1" -SdkConfig $sdk -BuildRoot $build
          }
          cargo --config $config fetch --manifest-path "$pluginRoot/Cargo.toml" --locked
          if ($LASTEXITCODE -ne 0) { throw 'Dependency fetch failed' }
          & "$pluginRoot/scripts/ci.ps1" -SdkConfig $sdk -BuildRoot $build
          if ($LASTEXITCODE -ne 0) { throw 'Independent viewer checks failed' }
      - name: Independent plugin tests and package (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          plugin_root='plugins/midnight-viewer-${{ matrix.plugin }}'
          sdk="$GITHUB_WORKSPACE/_build/released-sdk/.cargo/config.toml"
          build="$GITHUB_WORKSPACE/_build/viewer-ci"
          config="$sdk"
          if [[ -f "$plugin_root/scripts/prepare-sdk.py" ]]; then
            config=$(python3 -B "$plugin_root/scripts/prepare-sdk.py" "$sdk" "$build")
          fi
          cargo --config "$config" fetch --manifest-path "$plugin_root/Cargo.toml" --locked
          bash "$plugin_root/scripts/ci.sh" "$sdk" "$build"
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-${{ runner.os }}-${{ matrix.plugin }}
          if-no-files-found: error
          path: _build/viewer-ci/package/

  viewer-conformance:
    needs: public-sdk
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      # The fixture consumes only the released public SDK bundle.
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /plugins/viewer-conformance/
            /rust-toolchain.toml
            /.github/actions/
      - uses: actions/download-artifact@v4
        with:
          name: released-plugin-sdk
          path: _build/released-sdk
      - uses: ./.github/actions/rust-setup
      - name: Released SDK ABI conformance
        shell: pwsh
        run: |
          if ((Test-Path 'crates') -or (Test-Path 'api')) { throw 'Application or unpublished SDK source leaked into conformance job' }
          $temporary = Join-Path $env:GITHUB_WORKSPACE '_build/tmp'
          New-Item -ItemType Directory -Force $temporary | Out-Null
          $env:TEMP=$temporary; $env:TMP=$temporary; $env:TMPDIR=$temporary
          $sdk = (Resolve-Path '_build/released-sdk/.cargo/config.toml').Path
          $include = (Resolve-Path '_build/released-sdk/include').Path
          $manifest = 'plugins/viewer-conformance/Cargo.toml'
          $env:CARGO_TARGET_DIR = Join-Path $env:GITHUB_WORKSPACE '_build/conformance-target'
          cargo --config $sdk fetch --manifest-path $manifest --locked
          if ($LASTEXITCODE -ne 0) { throw 'Conformance dependency fetch failed' }
          cargo fmt --manifest-path $manifest --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Conformance formatting failed' }
          cargo clippy --config $sdk --manifest-path $manifest --all-targets --locked --offline -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Conformance strict Clippy failed' }
          cargo test --config $sdk --manifest-path $manifest --locked --offline
          if ($LASTEXITCODE -ne 0) { throw 'Conformance Rust tests failed' }
          cargo build --config $sdk --manifest-path $manifest --release --locked --offline
          if ($LASTEXITCODE -ne 0) { throw 'Conformance fixture build failed' }
          $results = Join-Path $env:GITHUB_WORKSPACE '_build/conformance'
          if ($IsWindows) {
            # The native loader test compiles C with an x64 MSVC developer environment.
            $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
            $studio = @(& $vswhere -latest -products '*' -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath)
            if ($LASTEXITCODE -ne 0 -or $studio.Count -ne 1) { throw 'Could not find installed x64 MSVC tools' }
            & (Join-Path $studio[0] 'Common7/Tools/Launch-VsDevShell.ps1') -Arch amd64 -HostArch amd64 -SkipAutomaticLocation | Out-Host
            & plugins/viewer-conformance/tests/test-windows.ps1 `
              -Library (Join-Path $env:CARGO_TARGET_DIR 'release/midnight_viewer_conformance.dll') `
              -HeaderDirectory $include -BuildRoot (Join-Path $results 'windows')
          } else {
            bash plugins/viewer-conformance/tests/test-linux.sh `
              (Join-Path $env:CARGO_TARGET_DIR 'release/libmidnight_viewer_conformance.so') `
              $include (Join-Path $results 'linux')
          }
          if ($LASTEXITCODE -ne 0) { throw 'Native viewer ABI conformance failed' }

  public-worker-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Keep all blobs for Cargo packaging; downstream plugin jobs remain sparse
      # and receive only their own sources plus the released public SDK bundle.
      - uses: actions/checkout@v4
      - uses: ./.github/actions/rust-setup
      - name: Check public protocol workspaces
        shell: bash
        run: |
          mkdir -p _build/tmp
          export TMPDIR="$GITHUB_WORKSPACE/_build/tmp" CARGO_TARGET_DIR="$GITHUB_WORKSPACE/_build/sdk-target"
          for api in api worker-api thumbnail-api filesystem-api image-viewer-api web-viewer-api; do
            cargo fetch --manifest-path "$api/Cargo.toml" --locked
          done
          for api in worker-api thumbnail-api filesystem-api image-viewer-api web-viewer-api; do
            cargo fmt --manifest-path "$api/Cargo.toml" --all -- --check
            cargo test --manifest-path "$api/Cargo.toml" --workspace --all-targets --locked --offline
            cargo clippy --manifest-path "$api/Cargo.toml" --workspace --all-targets --locked --offline -- -D warnings
          done
          # The HTML viewer consumes this canonical release; package it as the build does.
          python3 -B web-viewer-api/scripts/package.py
      - name: Package public image and worker APIs
        id: sdk
        shell: bash
        run: |
          export TMPDIR="$GITHUB_WORKSPACE/_build/tmp" CARGO_TARGET_DIR="$GITHUB_WORKSPACE/_build/sdk-target"
          output=$(cargo run --manifest-path api/Cargo.toml -p midnight-api-package --bin worker-packages --locked --offline -- "$GITHUB_WORKSPACE" "$GITHUB_WORKSPACE/_build/releases")
          bundle=$(printf '%s\n' "$output" | sed -n 's/^Public worker API\/SDK release bundle: //p' | tail -n 1)
          test -f "$bundle/.cargo/registry.toml"
          echo "bundle=$bundle" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: released-worker-sdk
          include-hidden-files: true
          if-no-files-found: error
          path: ${{ steps.sdk.outputs.bundle }}/

  image-viewer:
    needs: public-worker-sdk
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
        plugin: [image, pdf]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /plugins/midnight-viewer-${{ matrix.plugin }}/
            /plugins/image-decoder/
            /vendor/image/
            /rust-toolchain.toml
            /.github/actions/
      - uses: actions/download-artifact@v4
        with:
          name: released-worker-sdk
          path: _build/released-sdk
      - uses: ./.github/actions/rust-setup
      - name: Independently build and test raster viewer
        shell: pwsh
        run: |
          if ((Test-Path 'crates') -or (Test-Path 'image-viewer-api')) { throw 'Application or unpublished API source leaked into plugin job' }
          $temporary = Join-Path $env:GITHUB_WORKSPACE '_build/tmp'
          New-Item -ItemType Directory -Force $temporary | Out-Null
          $env:TEMP=$temporary; $env:TMP=$temporary; $env:TMPDIR=$temporary
          $sdk = (Resolve-Path '_build/released-sdk/.cargo/registry.toml').Path
          $build = Join-Path $env:GITHUB_WORKSPACE '_build/raster-viewer-ci'
          $plugin = 'plugins/midnight-viewer-${{ matrix.plugin }}'
          cargo --config $sdk fetch --manifest-path "$plugin/Cargo.toml" --locked
          if ($LASTEXITCODE -ne 0) { throw 'Raster dependency fetch failed' }
          if ($IsWindows) {
            & "$plugin/scripts/ci.ps1" -SdkConfig $sdk -BuildRoot $build
          } else {
            bash "$plugin/scripts/ci.sh" $sdk $build
          }
          if ($LASTEXITCODE -ne 0) { throw 'Independent raster viewer checks failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: viewer-${{ runner.os }}-${{ matrix.plugin }}
          if-no-files-found: error
          path: _build/raster-viewer-ci/package/

  # The image thumbnailer has the raster viewers' inputs (the shared decoder with its
  # pinned native dav1d build and the released worker SDK). The HTML viewer and the
  # video thumbnailer need pinned CEF and FFmpeg inputs that have no cached CI setup yet.
  thumbnail-image:
    needs: public-worker-sdk
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /plugins/midnight-thumbnail-image/
            /plugins/image-decoder/
            /vendor/image/
            /rust-toolchain.toml
            /.github/actions/
      - uses: actions/download-artifact@v4
        with:
          name: released-worker-sdk
          path: _build/released-sdk
      - uses: ./.github/actions/rust-setup
      - name: Independently check, test and build the image thumbnailer
        shell: pwsh
        run: |
          if ((Test-Path 'crates') -or (Test-Path 'thumbnail-api')) { throw 'Application or unpublished API source leaked into thumbnailer job' }
          $temporary = Join-Path $env:GITHUB_WORKSPACE '_build/tmp'
          New-Item -ItemType Directory -Force $temporary | Out-Null
          $env:TEMP=$temporary; $env:TMP=$temporary; $env:TMPDIR=$temporary
          $sdk = (Resolve-Path '_build/released-sdk/.cargo/registry.toml').Path
          $build = Join-Path $env:GITHUB_WORKSPACE '_build/thumbnail-ci'
          $plugin = 'plugins/midnight-thumbnail-image'
          cargo --config $sdk fetch --manifest-path "$plugin/Cargo.toml" --locked
          if ($LASTEXITCODE -ne 0) { throw 'Thumbnailer dependency fetch failed' }
          if ($IsWindows) {
            & "$plugin/scripts/ci.ps1" -SdkConfig $sdk -BuildRoot $build
          } else {
            bash "$plugin/scripts/ci.sh" $sdk $build
          }
          if ($LASTEXITCODE -ne 0) { throw 'Independent image thumbnailer checks failed' }

  archive-filesystem:
    needs: public-worker-sdk
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /plugins/midnight-fs-archive/
            /rust-toolchain.toml
            /.github/actions/
      - uses: actions/download-artifact@v4
        with:
          name: released-worker-sdk
          path: _build/released-sdk
      - uses: ./.github/actions/rust-setup
      - name: Independently check, test and package archive filesystem
        shell: pwsh
        run: |
          if ((Test-Path 'crates') -or (Test-Path 'filesystem-api') -or (Test-Path 'worker-api')) { throw 'Application or unpublished API source leaked into archive job' }
          $temporary = Join-Path $env:GITHUB_WORKSPACE '_build/tmp'
          New-Item -ItemType Directory -Force $temporary | Out-Null
          $env:TEMP=$temporary; $env:TMP=$temporary; $env:TMPDIR=$temporary
          $env:CARGO_INCREMENTAL='0'; $env:CARGO_PROFILE_DEV_DEBUG='0'; $env:CARGO_PROFILE_TEST_DEBUG='0'; $env:RUST_TEST_THREADS='1'
          $sdk = (Resolve-Path '_build/released-sdk/.cargo/registry.toml').Path
          $build = Join-Path $env:GITHUB_WORKSPACE '_build/archive-ci'
          $package = Join-Path $build 'package/archive'
          $plugin = 'plugins/midnight-fs-archive'
          $env:CARGO_TARGET_DIR = $build
          cargo --config $sdk fetch --manifest-path "$plugin/Cargo.toml" --locked
          if ($LASTEXITCODE -ne 0) { throw 'Archive dependency fetch failed' }
          cargo fmt --manifest-path "$plugin/Cargo.toml" --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Archive formatting failed' }
          cargo clippy --config $sdk --manifest-path "$plugin/Cargo.toml" --all-targets --locked --offline -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Archive strict Clippy failed' }
          # Both platforms opt in to the plugin tests (normal builds skip them) and
          # publish the optimized worker that the release smoke test installs.
          if ($IsWindows) {
            & "$plugin/scripts/build.ps1" -SdkConfig $sdk -BuildRoot $build -OutputDirectory $package -Profile release -Test -Offline
          } else {
            bash "$plugin/scripts/build.sh" $sdk $build $package release --test --offline
          }
          if ($LASTEXITCODE -ne 0) { throw 'Independent archive tests or packaging failed' }
          # The plugin's owned format and cooperative-cancellation fixtures for the host's
          # real-worker qualification in the check job (the test binary is already built).
          $env:MIDNIGHT_ARCHIVE_FIXTURES = Join-Path $env:GITHUB_WORKSPACE '_build/archive-fixtures'
          cargo test --config $sdk --manifest-path "$plugin/Cargo.toml" --test worker_fixtures --locked --offline -- --ignored
          if ($LASTEXITCODE -ne 0) { throw 'Archive worker fixture export failed' }
      - uses: actions/upload-artifact@v4
        with:
          name: filesystem-${{ runner.os }}-archive
          if-no-files-found: error
          path: _build/archive-ci/package/
      - uses: actions/upload-artifact@v4
        with:
          name: archive-fixtures-${{ runner.os }}
          if-no-files-found: error
          path: _build/archive-fixtures/

  filesystem-libraries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            provider: native
            plugin: midnight-filesystem-native-windows
            library: midnight_filesystem_native_windows.dll
            manifest: plugin.toml
          - os: ubuntu-24.04
            platform: linux
            provider: native
            plugin: midnight-filesystem-native-linux
            library: libmidnight_filesystem_native_linux.so
            manifest: plugin.toml
          - os: windows-latest
            platform: windows
            provider: network
            plugin: midnight-filesystem-network
            library: midnight_filesystem_network.dll
            manifest: plugin.windows.toml
          - os: ubuntu-24.04
            platform: linux
            provider: network
            plugin: midnight-filesystem-network
            library: libmidnight_filesystem_network.so
            manifest: plugin.linux.toml
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /plugins/${{ matrix.plugin }}/
            /filesystem-api/
            /rust-toolchain.toml
            /.github/actions/
      - uses: ./.github/actions/rust-setup
      - name: Linux local-only GIO test runtime
        if: matrix.provider == 'network' && runner.os == 'Linux'
        run: |
          # Hosted Ubuntu already includes GIO. Avoid network/package updates
          # when this local-only test dependency is installed.
          if ! dpkg-query -W -f='${db:Status-Status}' libglib2.0-0t64 2>/dev/null | grep -qx installed; then
            sudo apt-get update --error-on=any
            sudo apt-get install -y --no-install-recommends libglib2.0-0t64
          fi
      - name: Build and test with public filesystem API only
        shell: pwsh
        run: |
          if (Test-Path 'crates') { throw 'Private application code leaked into filesystem plugin build' }
          $plugin = 'plugins/${{ matrix.plugin }}'
          $build = Join-Path $env:GITHUB_WORKSPACE '_build/filesystem-library'
          $temporary = Join-Path $env:GITHUB_WORKSPACE '_build/tmp'
          New-Item -ItemType Directory -Force $temporary | Out-Null
          $env:CARGO_TARGET_DIR=$build; $env:TEMP=$temporary; $env:TMP=$temporary; $env:TMPDIR=$temporary
          if ('${{ matrix.provider }}' -eq 'network' -and -not $IsWindows) { $env:GIO_USE_VFS='local' }
          cargo fmt --manifest-path filesystem-api/Cargo.toml --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Filesystem API formatting failed' }
          cargo test --manifest-path filesystem-api/Cargo.toml --workspace --locked
          if ($LASTEXITCODE -ne 0) { throw 'Filesystem API/SDK tests failed' }
          cargo clippy --manifest-path filesystem-api/Cargo.toml --workspace --all-targets --locked --offline -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Filesystem API/SDK strict checks failed' }
          cargo fmt --manifest-path "$plugin/Cargo.toml" --all -- --check
          if ($LASTEXITCODE -ne 0) { throw 'Filesystem plugin formatting failed' }
          cargo test --manifest-path "$plugin/Cargo.toml" --locked
          if ($LASTEXITCODE -ne 0) { throw 'Filesystem plugin tests failed' }
          if ('${{ matrix.provider }}' -eq 'network' -and -not $IsWindows) {
            cargo test --manifest-path "$plugin/Cargo.toml" --locked --offline local_only_runtime_reports_network_backend_unavailable -- --ignored
            if ($LASTEXITCODE -ne 0) { throw 'Local-only unavailable GIO runtime check failed' }
          }
          cargo clippy --manifest-path "$plugin/Cargo.toml" --all-targets --locked --offline -- -D warnings
          if ($LASTEXITCODE -ne 0) { throw 'Filesystem plugin strict checks failed' }
          cargo build --manifest-path "$plugin/Cargo.toml" --release --locked --offline
          if ($LASTEXITCODE -ne 0) { throw 'Filesystem plugin release build failed' }
          $package = Join-Path $build 'package/${{ matrix.provider }}.${{ matrix.platform }}'
          New-Item -ItemType Directory -Force $package | Out-Null
          $library = '${{ matrix.library }}'
          Copy-Item -LiteralPath (Join-Path $build "release/$library") -Destination $package
          Copy-Item -LiteralPath "$plugin/${{ matrix.manifest }}" -Destination (Join-Path $package 'plugin.toml')
          foreach ($name in @('README.md','THIRD-PARTY.md')) {
            Copy-Item -LiteralPath "$plugin/$name" -Destination $package
          }
      - uses: actions/upload-artifact@v4
        with:
          name: filesystem-${{ runner.os }}-${{ matrix.provider }}
          if-no-files-found: error
          path: _build/filesystem-library/package/

  # Formatting, Clippy and the build-script tests use no plugin package; in their own
  # job they run beside the plugin jobs and the workspace tests instead of before them.
  scripts-and-lint:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    env:
      # As in the check job, so that both build their dependencies alike.
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/private-test-installation
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-build-prerequisites
      - uses: ./.github/actions/rust-setup
        with:
          build-cache: "true"
      - name: Format
        run: cargo fmt --all -- --check
      - name: Build script and packaging tests
        run: python -B -m unittest discover -s scripts/tests -v
      - name: Shared image decoder native helper tests
        run: python -B -m unittest discover -s plugins/image-decoder/native/tests -v
      - name: Deployment, registration and shortcut tests (Windows PowerShell 5.1 and 7)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Production runs these helpers under PowerShell 7; they stay 5.1 compatible.
          foreach ($test in @('test-private-deployment.ps1', 'test-runtime-registration.ps1',
              'test-build-deployment-retirement.ps1', 'test-desktop-shortcut.ps1')) {
            foreach ($shell in @('pwsh', 'powershell.exe')) {
              & $shell -NoLogo -NoProfile -File "scripts/tests/$test"
              if ($LASTEXITCODE -ne 0) { throw "$test failed under $shell" }
            }
          }
      - name: Source size (Windows)
        if: runner.os == 'Windows'
        run: pwsh scripts/check-source-size.ps1
      - name: Source size (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/check-source-size.sh
      # The opt-in end-to-end acceptance suite only builds with its feature, which no
      # other package enables, so `--workspace --all-targets` alone would skip it. It is
      # not run here (it drives the real application), but it is linted on both
      # platforms with the workspace, so that its platform-specific code cannot stop
      # compiling unnoticed. One step keeps one feature resolution: every other package
      # resolves as without the feature, whereas `-p midnight-acceptance` alone would
      # drop the workspace's dev-dependency features (tokio's `test-util`) and check
      # tokio and everything above it a second time.
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked --features midnight-acceptance/acceptance -- -D warnings

  # The workspace tests start at once; only the qualification steps after them wait
  # for this run's plugin packages (the plugin-packages action).
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
    env:
      # Debug information and incremental output would only cost build time and disk
      # here (with debug information the generated UI suite once filled the runner disk).
      # Four jobs match the runner's four CPUs and fit its 16 GB
      # (docs/verification/2026-11-21-ci-time.md).
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/private-test-installation
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-build-prerequisites
      - uses: ./.github/actions/rust-setup
        with:
          build-cache: "true"
      - name: Test
        run: python -B scripts/ci-workspace-tests.py --retire-successful-test-artifacts
      # The steps below reuse the gates' workspace feature selection through
      # ci-workspace-tests.py; `cargo test -p` would rebuild shared dependencies.
      - name: Qualify Linux cross-filesystem Trash
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/ci-workspace-tests.py run midnight-platform-linux lib \
            mutation::tests::cross_filesystem_trash_returns_unsupported_and_keeps_source \
            --exact --nocapture 2>&1 | tee _build/cross-filesystem-trash.log
          grep -Fq 'QUALIFIED cross_filesystem_trash:' _build/cross-filesystem-trash.log
      - name: Native viewer ABI rejection fixture
        shell: pwsh
        run: |
          cargo build --manifest-path crates/midnight-plugin-host/tests/fixtures/bad-descriptor/Cargo.toml --locked --offline --target-dir _build/bad-viewer-descriptor
          if ($LASTEXITCODE -ne 0) { throw 'Bad descriptor fixture build failed' }
          $library = if ($IsWindows) { 'midnight_host_bad_descriptor.dll' } else { 'libmidnight_host_bad_descriptor.so' }
          $path = Join-Path $env:GITHUB_WORKSPACE "_build/bad-viewer-descriptor/debug/$library"
          "HOST_BAD_PLUGIN=$path" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - uses: ./.github/actions/plugin-packages
        with:
          runner-label: ${{ matrix.os }}
          archive-fixtures: "true"
      # The non-ignored tests of every target below already ran in the workspace gates.
      - name: Native viewer open, viewport, search and quiescent close
        run: python -B scripts/ci-workspace-tests.py run midnight-plugin-host lib --ignored
      # The native CEF Office/HTML and qualified-product Source acceptance tests are manual
      # qualifications (trusted CEF installation, qualified product build; FEATURE_STATUS.md).
      - name: Native viewer engine rendering, search, copy, mode and file-cycle integration
        run: python -B scripts/ci-workspace-tests.py run midnight-viewer-engine lib --ignored --nocapture --skip office_preview::native_tests --skip tests::source_native_acceptance
      - name: Installed native filesystem browse, read, volumes and absence checks
        run: python -B scripts/ci-workspace-tests.py run midnight-native-filesystem-host test:native --ignored --test-threads=1
      - name: Installed network metadata boundary without LAN discovery
        shell: pwsh
        run: |
          $env:MIDNIGHT_NETWORK_TEST_INSTALLATION = $env:MIDNIGHT_NATIVE_TEST_INSTALLATION
          python -B scripts/ci-workspace-tests.py run midnight-native-filesystem-host lib installed_network_metadata --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Installed network metadata boundary failed' }
      - name: Application viewers use native provider and refuse missing provider
        shell: pwsh
        run: |
          $executable = python -B scripts/ci-workspace-tests.py artifact midnight-explorer bin:me
          if ($LASTEXITCODE -ne 0 -or -not $executable) { throw 'Application test executable not reported' }
          $name = if ($IsWindows) { 'native-app-test.exe' } else { 'native-app-test' }
          $probe = Join-Path $env:HOST_TEST_INSTALL_ROOT $name
          Copy-Item -LiteralPath ($executable | Select-Object -Last 1) -Destination $probe
          if (-not $IsWindows) { chmod 700 -- $probe }
          $fixture = Join-Path $env:GITHUB_WORKSPACE '_build/native-app-fixture'
          New-Item -ItemType Directory -Force $fixture | Out-Null
          Set-Content -LiteralPath (Join-Path $fixture 'first 文档.txt') -Value 'First native provider content' -Encoding utf8NoBOM
          Set-Content -LiteralPath (Join-Path $fixture 'second.txt') -Value 'Second native provider content' -Encoding utf8NoBOM
          $env:MIDNIGHT_APP_NATIVE_TEST_FILES=$fixture
          & $probe viewers::tests::native_plugin_ --ignored --nocapture --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Application F3 native plugin integration failed' }
      - name: Restricted image process source validation, cancellation and retained pixels
        run: python -B scripts/ci-workspace-tests.py run midnight-image-viewer-host test:native --ignored --test-threads=1
      - name: Restricted PDF process pagination, source validation and cancellation
        run: python -B scripts/ci-workspace-tests.py run midnight-image-viewer-host test:pdf_native --ignored --test-threads=1
      # Listing archives of millions of members is a manual measurement with archives that
      # the archive plugin's measure_index_memory generates (TEST_EXECUTION.md).
      - name: Restricted archive worker listing, source validation and cancellation
        run: python -B scripts/ci-workspace-tests.py run midnight-filesystem-host test:worker --ignored --test-threads=1 --skip real_sandboxed_worker_lists_archives_of_millions_of_members
      - name: Restricted archive workers open archives inside archives
        run: python -B scripts/ci-workspace-tests.py run midnight-filesystem-host test:nested_worker --ignored --test-threads=1
      - name: Installed archive worker streaming, all formats, cooperative cancellation and package discovery
        shell: pwsh
        run: |
          # The installed archive package, the archive job's exported fixtures and a
          # generated ZIP above the former 64 MiB source ceiling.
          $env:ARCHIVE_CAPTURE_INSTALLATION = $env:HOST_TEST_INSTALL_ROOT
          $env:MIDNIGHT_ARCHIVE_FIXTURES = Join-Path $env:GITHUB_WORKSPACE '_build/archive-fixtures'
          $env:MIDNIGHT_ARCHIVE_TEST_ZIP = Join-Path $env:GITHUB_WORKSPACE '_build/archive-test.zip'
          python -B scripts/archive-test-zip.py $env:MIDNIGHT_ARCHIVE_TEST_ZIP
          if ($LASTEXITCODE -ne 0) { throw 'Large ZIP fixture generation failed' }
          # Decoded members are staged on the spool volume (TEMP on Windows, the user's
          # cache first on Linux), which must keep max(1 GiB, 2%) + 64 MiB free.
          if ($IsWindows) { Get-PSDrive -Name $env:TEMP.Substring(0, 1) | Format-Table Name, Used, Free } else { df -h -- $HOME $env:TMPDIR }
          python -B scripts/ci-workspace-tests.py run midnight-filesystem-host test:streaming_worker --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Installed archive worker streaming qualification failed' }
          python -B scripts/ci-workspace-tests.py run midnight-filesystem-host lib captured_source_tests:: --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Installed archive worker pathless content failed' }
          python -B scripts/ci-workspace-tests.py run midnight-filesystem-host test:discovery_kinds --ignored --test-threads=1
          if ($LASTEXITCODE -ne 0) { throw 'Protected filesystem package discovery failed' }
      # -noreset: an X server resets when its last client disconnects and refuses
      # connections during the reset, such as the first one of the next test.
      - name: Native X11 drag and drop (isolated display)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          executable=$(python3 -B scripts/ci-workspace-tests.py artifact midnight-platform-linux lib)
          cd crates/midnight-platform-linux
          xvfb-run -a -s "-screen 0 1280x1024x24 -nolisten tcp -noreset" \
            env MIDNIGHT_DND_TEST_ISOLATED=1 "$executable" file_drag_drop:: --ignored --test-threads=1
      - name: Native X11 clipboard (isolated display)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          executable=$(python3 -B scripts/ci-workspace-tests.py artifact midnight-platform-linux lib)
          cd crates/midnight-platform-linux
          # Without WAYLAND_DISPLAY, arboard cannot reach a real desktop clipboard.
          xvfb-run -a -s "-screen 0 1280x1024x24 -nolisten tcp -noreset" \
            env -u WAYLAND_DISPLAY MIDNIGHT_CLIPBOARD_TEST_ISOLATED=1 "$executable" \
            clipboard::tests::x11_ file_clipboard::x11::tests:: --ignored --test-threads=1

  # The fat-LTO release build runs beside the test job instead of after it, and like it
  # waits for the plugin packages only before its smoke test.
  release:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    permissions:
      contents: read
      actions: read
    env:
      CARGO_INCREMENTAL: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/private-test-installation
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-build-prerequisites
      - uses: ./.github/actions/rust-setup
        with:
          build-cache: "true"
      - name: Optimized release build
        run: cargo build -p midnight-explorer -p midnight-elevation --release --locked
      - uses: ./.github/actions/plugin-packages
        with:
          runner-label: ${{ matrix.os }}
      - name: Release filesystem smoke test
        shell: pwsh
        run: |
          $name = if ($IsWindows) { 'me.exe' } else { 'me' }
          $executable = Join-Path $env:HOST_TEST_INSTALL_ROOT $name
          Copy-Item -LiteralPath "_build/release/$name" -Destination $executable
          # The Administrator/root helper is built for administrator-managed installations;
          # a private test installation never uses it, so it is checked but not installed.
          $helper = if ($IsWindows) { 'midnight-elevated-listing.exe' } else { 'midnight-elevated-listing' }
          if (-not (Test-Path -LiteralPath "_build/release/$helper" -PathType Leaf)) { throw "Release build is missing $helper" }
          if ($IsWindows) {
            $process = Start-Process -FilePath $executable -ArgumentList '--smoke-test' -WindowStyle Hidden -Wait -PassThru
            if ($process.ExitCode -ne 0) { throw 'Installed native filesystem smoke failed' }
          } else {
            chmod 700 -- $executable
            & $executable --smoke-test
            if ($LASTEXITCODE -ne 0) { throw 'Installed native filesystem smoke failed' }
          }
