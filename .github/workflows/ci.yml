name: build-and-test

on: [push, pull_request]

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare build temporary directory
        shell: pwsh
        run: |
          $temporaryDirectory = Join-Path $env:GITHUB_WORKSPACE '_build/tmp'
          New-Item -ItemType Directory -Path $temporaryDirectory -Force | Out-Null
          @("TEMP=$temporaryDirectory", "TMP=$temporaryDirectory", "TMPDIR=$temporaryDirectory") |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Linux prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y pkg-config libfontconfig1-dev libfreetype6-dev libxkbcommon-dev libx11-dev libxcb1-dev libwayland-dev libudev-dev
      - name: Install pinned toolchain
        run: rustup show
      - name: Format
        run: cargo fmt --all -- --check
      - name: Source size (Windows)
        if: runner.os == 'Windows'
        run: pwsh scripts/check-source-size.ps1
      - name: Source size (Linux)
        if: runner.os == 'Linux'
        run: bash scripts/check-source-size.sh
      - name: Test
        run: cargo test --workspace --locked
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Build
        run: cargo build -p fm-app --locked
      - name: Filesystem smoke test
        run: cargo run -p fm-app --locked -- --smoke-test
