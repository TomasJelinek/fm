name: ci-time-attribution

# Experiment only: link.exe and rust-lld test builds on the same Windows machine.
on:
  push:
    branches: [ci-time-attribution]

permissions:
  contents: read

env:
  PYTHONUTF8: "1"
  CARGO_REGISTRIES_MIDNIGHT_INDEX: https://midnight-explorer.invalid/api-index

jobs:
  paired-linkers:
    strategy:
      fail-fast: false
      matrix:
        order: ["link lld", "lld link"]
    runs-on: windows-latest
    timeout-minutes: 120
    env:
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
      CARGO_INCREMENTAL: "0"
      CARGO_BUILD_JOBS: "4"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/private-test-installation
      - uses: ./.github/actions/rust-setup
      - name: Machine
        shell: pwsh
        run: |
          Get-CimInstance Win32_Processor | Format-List Name, NumberOfCores, NumberOfLogicalProcessors, MaxClockSpeed
          Get-PSDrive -PSProvider FileSystem | Format-Table Name, Used, Free
      - name: Fetch
        run: cargo fetch --locked
      - name: Paired test builds
        shell: pwsh
        run: |
          foreach ($linker in '${{ matrix.order }}'.Split(' ')) {
            if ($linker -eq 'lld') { $env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER = 'rust-lld.exe' }
            else { Remove-Item Env:CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER -ErrorAction SilentlyContinue }
            $env:CARGO_TARGET_DIR = Join-Path $env:GITHUB_WORKSPACE "_build/paired-$linker"
            $watch = [Diagnostics.Stopwatch]::StartNew()
            cargo test --workspace --locked --offline --no-run --timings 2>&1 | Out-File -FilePath "_build/paired-$linker.log"
            if ($LASTEXITCODE -ne 0) { Get-Content "_build/paired-$linker.log" -Tail 40; throw "$linker build failed" }
            "{0} build {1:N1} s" -f $linker, $watch.Elapsed.TotalSeconds | Tee-Object -FilePath _build/paired-results.txt -Append
            $deps = Join-Path $env:CARGO_TARGET_DIR 'debug/deps'
            $exe = (Get-ChildItem $deps -Filter *.exe | Measure-Object Length -Sum).Sum / 1MB
            $pdb = (Get-ChildItem $deps -Filter *.pdb | Measure-Object Length -Sum).Sum / 1MB
            "{0} executables {1:N0} MB, PDBs {2:N0} MB" -f $linker, $exe, $pdb | Tee-Object -FilePath _build/paired-results.txt -Append
            Get-PSDrive -Name D | Format-Table Name, Used, Free
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: paired-timings-${{ strategy.job-index }}
          path: |
            _build/paired-*/cargo-timings/cargo-timing.html
            _build/paired-results.txt
