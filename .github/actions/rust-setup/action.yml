name: Rust setup
description: >-
  Install the rust-toolchain.toml toolchain explicitly and restore the Cargo download
  cache, or with build-cache the root workspace's compiled dependencies as well.
inputs:
  build-cache:
    description: >-
      Cache the Cargo downloads and the compiled third-party dependencies in _build
      (Swatinem/rust-cache; workspace crates are never cached). Pushes to main save a new
      entry when the key changes; other runs only restore.
    default: "false"
runs:
  using: composite
  steps:
    # Current rustup no longer installs the active toolchain through `rustup show`;
    # an explicit install also fails clearly instead of relying on proxy downloads.
    - name: Install pinned toolchain
      shell: pwsh
      run: |
        $toolchain = Get-Content -LiteralPath rust-toolchain.toml -Raw
        $channel = [regex]::Match($toolchain, '(?m)^channel = "([^"]+)"').Groups[1].Value
        $toolchainProfile = [regex]::Match($toolchain, '(?m)^profile = "([^"]+)"').Groups[1].Value
        $listed = [regex]::Match($toolchain, '(?m)^components = \[([^\]]*)\]').Groups[1].Value
        $components = @([regex]::Matches($listed, '"([^"]+)"') | ForEach-Object { '--component'; $_.Groups[1].Value })
        if (-not $channel -or -not $toolchainProfile) { throw 'rust-toolchain.toml lacks a channel or profile' }
        rustup toolchain install $channel --profile $toolchainProfile @components
        if ($LASTEXITCODE -ne 0) { throw 'Pinned toolchain installation failed' }
    # Registry and Git downloads only; build outputs stay job-local.
    - if: inputs.build-cache != 'true'
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/registry/index/
          ~/.cargo/registry/cache/
          ~/.cargo/git/db/
        key: cargo-${{ runner.os }}-${{ github.job }}-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
        restore-keys: |
          cargo-${{ runner.os }}-${{ github.job }}-
    # The key covers the job, the rustc version and host, the Cargo manifests, lockfiles
    # and configuration and the CARGO_*/RUST* environment; a miss restores the newest
    # entry of the same job and OS. LGPL-3.0, used unmodified (docs/DEPENDENCY_POLICY.md).
    - if: inputs.build-cache == 'true'
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      with:
        workspaces: ". -> _build"
        cache-bin: "false"
        save-if: ${{ github.ref == 'refs/heads/main' }}
